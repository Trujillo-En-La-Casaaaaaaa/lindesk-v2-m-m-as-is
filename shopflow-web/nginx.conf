# shopflow-web - single browser-facing origin: static SPA assets plus the frozen `/api/*` proxy.
#
# The container is published as `3000:80`, so the user-facing origin stays http://127.0.0.1:3000 and
# no CORS configuration is part of the contract. `api` is the Compose service name owned by
# shopflow-infra; nginx keeps the `/api` prefix because `proxy_pass` has no URI part.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (/, /products/:id, /orders/new, /orders/:id) fall back to the SPA document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
