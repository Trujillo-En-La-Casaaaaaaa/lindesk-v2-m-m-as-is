services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shopflow_pg:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://shopflow:shopflow@db:5432/shopflow
      PORT: "3000"
      NOTIFICATION_LOG_PATH: /data/notifications.jsonl
    volumes:
      - notify_data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  shopflow_pg:
  notify_data:
